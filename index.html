<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Button</title>
  <meta name="description" content="An interactive button that cycles through five colors with every click." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-border: rgba(255,255,255,0.06);
      --text-primary: #f0f2f8;
      --text-secondary: #8b8fa8;
      --radius-lg: 20px;
      --radius-btn: 14px;
      --transition: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 0.2s ease;

      --c-red:    #e8323a;
      --c-blue:   #2e6cf6;
      --c-purple: #8b3dff;
      --c-green:  #27c06b;
      --c-yellow: #f5b800;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      overflow: hidden;
    }

    .glow-orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
      transition: background-color 0.6s ease;
      background-color: var(--c-red);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 3.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .card__header {
      text-align: center;
    }

    .card__title {
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .card__subtitle {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .color-track {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      opacity: 0.3;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dot.active {
      opacity: 1;
      transform: scale(1.35);
    }

    .dot[data-color="red"]    { background: var(--c-red); }
    .dot[data-color="blue"]   { background: var(--c-blue); }
    .dot[data-color="purple"] { background: var(--c-purple); }
    .dot[data-color="green"]  { background: var(--c-green); }
    .dot[data-color="yellow"] { background: var(--c-yellow); }

    .color-btn {
      position: relative;
      cursor: pointer;
      border: none;
      outline: none;
      border-radius: var(--radius-btn);
      padding: 1.1rem 3.2rem;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
      background-color: var(--c-red);
      box-shadow: 0 4px 24px rgba(232, 50, 58, 0.45);
      transition:
        background-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition-fast);
      overflow: hidden;
    }

    .color-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px) scale(1.02);
    }

    .color-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.35);
      transform: scale(0);
      animation: ripple-anim 0.55s linear forwards;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to {
        transform: scale(30);
        opacity: 0;
      }
    }

    .color-label {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-red);
      transition: color 0.3s ease;
    }

    .click-counter {
      font-size: 0.78rem;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    @media (max-width: 420px) {
      .card {
        padding: 2.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="glow-orb" id="glowOrb"></div>

  <div class="card">
    <div class="card__header">
      <h1 class="card__title">Color Cycle</h1>
      <p class="card__subtitle">Click the button and watch it change color.<br>It loops every five clicks.</p>
    </div>

    <div class="color-track" role="list" aria-label="Color sequence">
      <div class="dot active" data-color="red"    role="listitem" aria-label="Red"></div>
      <div class="dot"        data-color="blue"   role="listitem" aria-label="Blue"></div>
      <div class="dot"        data-color="purple" role="listitem" aria-label="Purple"></div>
      <div class="dot"        data-color="green"  role="listitem" aria-label="Green"></div>
      <div class="dot"        data-color="yellow" role="listitem" aria-label="Yellow"></div>
    </div>

    <button
      class="color-btn"
      id="colorBtn"
      aria-label="Color cycling button — currently Red"
    >
      Click Me
    </button>

    <span class="color-label" id="colorLabel">Red</span>
    <span class="click-counter" id="clickCounter">0 clicks</span>
  </div>

  <script>
    const colors = [
      { name: 'Red',    hex: '#e8323a', shadow: 'rgba(232, 50, 58,  0.5)', key: 'red'    },
      { name: 'Blue',   hex: '#2e6cf6', shadow: 'rgba(46,  108, 246, 0.5)', key: 'blue'   },
      { name: 'Purple', hex: '#8b3dff', shadow: 'rgba(139, 61,  255, 0.5)', key: 'purple' },
      { name: 'Green',  hex: '#27c06b', shadow: 'rgba(39,  192, 107, 0.5)', key: 'green'  },
      { name: 'Yellow', hex: '#f5b800', shadow: 'rgba(245, 184, 0,   0.5)', key: 'yellow' },
    ];

    let step = 0;
    let totalClicks = 0;

    const btn     = document.getElementById('colorBtn');
    const label   = document.getElementById('colorLabel');
    const counter = document.getElementById('clickCounter');
    const glow    = document.getElementById('glowOrb');
    const dots    = document.querySelectorAll('.dot');

    function applyColor(index) {
      const c = colors[index];

      btn.style.backgroundColor = c.hex;
      btn.style.boxShadow       = `0 4px 24px ${c.shadow}`;
      btn.setAttribute('aria-label', `Color cycling button — currently ${c.name}`);

      label.textContent = c.name;
      label.style.color = c.hex;

      glow.style.backgroundColor = c.hex;

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    function createRipple(event) {
      const rect   = btn.getBoundingClientRect();
      const x      = event.clientX - rect.left;
      const y      = event.clientY - rect.top;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = `${x - 5}px`;
      ripple.style.top  = `${y - 5}px`;
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }

    btn.addEventListener('click', (e) => {
      createRipple(e);

      totalClicks++;
      step = totalClicks % colors.length;

      applyColor(step);

      const n = totalClicks;
      counter.textContent = `${n} click${n === 1 ? '' : 's'}`;
    });
  </script>

</body>
</html>
